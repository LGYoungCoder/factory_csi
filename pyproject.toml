[project]
name = "factory-csi"
version = "0.1.0"
description = "Factory CSI – AI Manufacturing Quality Investigation Copilot (Kiroween 2026, Frankenstein)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "mcp>=1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "litellm>=1.60",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory_data", "simulator", "industrial_mcp", "backend", "evaluation"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["frontend", "data", "var", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm' --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::UserWarning:pydantic._internal._generate_schema",
    "ignore::DeprecationWarning",
]
markers = [
    "llm: calls a real LLM provider (needs a valid key in .env, costs money); run with -m llm",
]

[tool.importlinter]
root_packages = ["factory_data", "simulator", "industrial_mcp", "backend", "evaluation"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Backend and MCP server never import the answer key"
type = "forbidden"
source_modules = ["backend", "industrial_mcp"]
forbidden_modules = ["simulator.ground_truth", "simulator.cli", "simulator.writer"]

[[tool.importlinter.contracts]]
name = "factory_data is the bottom layer"
type = "forbidden"
source_modules = ["factory_data"]
forbidden_modules = ["simulator", "backend", "industrial_mcp", "evaluation"]

[[tool.importlinter.contracts]]
name = "Product packages never import the evaluation harness"
type = "forbidden"
source_modules = ["factory_data", "simulator", "industrial_mcp", "backend"]
forbidden_modules = ["evaluation"]

[[tool.importlinter.contracts]]
name = "MCP read tools never touch world state or verification"
type = "forbidden"
source_modules = ["industrial_mcp.queries"]
forbidden_modules = ["factory_data.world_state", "industrial_mcp.verification"]
